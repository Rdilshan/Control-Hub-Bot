services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - controlhub_internal
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_app
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "127.0.0.1:8008:8000"
    env_file:
      - ./env/.env.production
    tmpfs:
      - /tmp/controlhub:size=64M,uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-telegram:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_worker_telegram
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=telegram_updates"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-video:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_worker_video
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=video_processing"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    tmpfs:
      - /tmp/controlhub:size=128M,uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-broadcast:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=broadcast_live"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-catchup:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_worker_catchup
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=catchup"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-collection:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=collection_delivery"]
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-lifecycle:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_worker_lifecycle
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.worker_entrypoint", "--queue=lifecycle"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: controlhub_scheduler
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.workers.scheduler_entrypoint"]
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      disable: true
    env_file:
      - ./env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: controlhub_postgres
    restart: unless-stopped
    env_file:
      - ./env/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: controlhub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - controlhub_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  controlhub_internal:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:cafe:1234::/64

volumes:
  postgres_data:
  redis_data:
